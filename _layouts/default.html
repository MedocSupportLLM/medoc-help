<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noimageindex">
<meta name="googlebot" content="noindex, nofollow, noimageindex">
<title>{{ page.title | default: site.title }}</title>
<style>
  :root { --bg:#fff; --fg:#1f2328; --muted:#59636e; --link:#0969da; --line:#d1d9e0; --code:#f6f8fa; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --link:#4493f8; --line:#3d444d; --code:#151b23; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 -apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
  main { max-width:960px; margin:0 auto; padding:24px 16px 64px; }
  a { color:var(--link); }
  h1 { font-size:1.8em; border-bottom:1px solid var(--line); padding-bottom:.3em; }
  h2, h3, h4, h5, h6 { margin-top:1.8em; }
  img { max-width:100%; height:auto; border:1px solid var(--line); border-radius:4px; }
  table { border-collapse:collapse; display:block; overflow-x:auto; }
  th, td { border:1px solid var(--line); padding:4px 8px; vertical-align:top; }
  code, pre { background:var(--code); border-radius:4px; }
  pre { padding:12px; overflow-x:auto; }
  em { color:var(--muted); }
</style>
</head>
<body><main>
{{ content }}
</main></body>
</html>
